  app:
    build: .
    image: waveposapidte:latest
    container_name: waveposapidte-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=premier-orion-pa.cloudservices.tech
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-tecwave_fe_dba}
      - DB_USER=${DB_USER:-tecwave_fe_dba}
      - DB_PASSWORD=${DB_PASSWORD:-vpt6fBX5bnm3vaf@jnh}
      - JWT_SECRET=${JWT_SECRET:-secret_prod_change_me}
      - PORT=3000
      - DTE_SIGNER_URL=http://firmador:8113
    depends_on:
      #- db
      - firmador
    volumes:
      - ./server/certs:/app/server/certs
    networks:
      - waveposapidte-net

  firmador:
    image: svfe/svfe-api-firmador:v20230109
    container_name: waveposapidte-firmador
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SVFE_ARCHIVO=certs/certificado.p12  # Este es un valor por defecto, se sobreescribe con el NIT real
      - SVFE_PASSWORD=hacienda
    volumes:
      - ./server/certs:/app/certs
    networks:
      - waveposapidte-net

networks:
  waveposapidte-net:
    driver: bridge

volumes:
  postgres_data:
