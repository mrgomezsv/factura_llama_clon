services:
  app:
    build: .
    container_name: wavepos-app
    restart: always
    ports:
      - "50400:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=45.10.160.29
      - DATABASE_PORT=3306
      - DATABASE_NAME=${DATABASE_NAME:-thetecwa1_lap_fe_prod}
      - DATABASE_USER=${DATABASE_USER:-thetecwa1_lap_fe_prod}
      # La contraseña contiene caracteres especiales que deben escaparse con doble $$ si se usan directamente aquí
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-ml%BHX$$C//Z$$f6uL}
      - JWT_SECRET=${JWT_SECRET:-secret_prod_change_me}
      - PORT=3000
      - BASE_URL=${BASE_URL:-http://51.222.211.102:50400}
      - DTE_SIGNER_URL=http://firmador:8113
    depends_on:
      - firmador
    volumes:
      - ./server/certs:/app/server/certs
    networks:
      - wavepos-net

  firmador:
    image: svfe/svfe-api-firmador:v20230109
    container_name: wavepos-firmador
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SVFE_ARCHIVO=certs/certificado.p12
      - SVFE_PASSWORD=hacienda
    volumes:
      - ./server/certs:/app/certs
    networks:
      - wavepos-net

networks:
  wavepos-net:
    driver: bridge
