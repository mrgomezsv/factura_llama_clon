services:
  db:
    image: postgres:15-alpine
    container_name: waveposapidte-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-waveposapidte}
      POSTGRES_USER: ${DB_USER:-mrgomez}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tecwave}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - waveposapidte-net

  app:
    build: .
    container_name: waveposapidte-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-waveposapidte}
      - DB_USER=${DB_USER:-mrgomez}
      - DB_PASSWORD=${DB_PASSWORD:-tecwave}
      - JWT_SECRET=${JWT_SECRET:-secret_prod_change_me}
      - PORT=3000
      - DTE_SIGNER_URL=http://firmador:8113
    depends_on:
      - db
      - firmador
    volumes:
      - ./server/certs:/app/server/certs
    networks:
      - waveposapidte-net

  firmador:
    image: svfe/svfe-api-firmador:v20230109
    container_name: waveposapidte-firmador
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SVFE_ARCHIVO=certs/certificado.p12  # Este es un valor por defecto, se sobreescribe con el NIT real
      - SVFE_PASSWORD=hacienda
    volumes:
      - ./server/certs:/app/certs
    networks:
      - waveposapidte-net

networks:
  waveposapidte-net:
    driver: bridge

volumes:
  postgres_data:
