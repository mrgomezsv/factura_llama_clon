services:
  app:
    build: .
    container_name: wavepos-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=45.10.160.29
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-thetecwa1_fe_dba_prod}
      - DB_USER=${DB_USER:-thetecwa1_fe_dba_prod}
      # La contraseña contiene caracteres especiales que deben escaparse con doble $$ si se usan directamente aquí
      - DB_PASSWORD=${DB_PASSWORD:-ml%BHX$$C//Z$$f6uL}
      - JWT_SECRET=${JWT_SECRET:-secret_prod_change_me}
      - PORT=3000
      - DTE_SIGNER_URL=http://firmador:8113
    depends_on:
      - firmador
    volumes:
      - ./server/certs:/app/server/certs
    networks:
      - wavepos-net

  firmador:
    image: svfe/svfe-api-firmador:v20230109
    container_name: wavepos-firmador
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SVFE_ARCHIVO=certs/certificado.p12
      - SVFE_PASSWORD=hacienda
    volumes:
      - ./server/certs:/app/certs
    networks:
      - wavepos-net

networks:
  wavepos-net:
    driver: bridge
