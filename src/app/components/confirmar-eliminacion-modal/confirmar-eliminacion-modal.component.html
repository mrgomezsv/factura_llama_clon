<div class="modal-overlay" (click)="onCancelar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="icon-container">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 9V13M12 17H12.01M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="modal-title">{{ titulo }}</h2>
    </div>
    
    <div class="modal-body">
      <p class="modal-message">{{ mensaje || `¿Estás seguro de que deseas eliminar "${nombreItem}"?` }}</p>
      <p class="modal-warning">Esta acción no se puede deshacer.</p>
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" (click)="onCancelar()" type="button">Cancelar</button>
      <button class="btn-confirmar" (click)="onConfirmar()" type="button">Eliminar</button>
    </div>
  </div>
</div>
