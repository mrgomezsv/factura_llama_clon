<div class="login-page">
  <div class="login-card">
    <div class="logo-row">
      <svg class="llama-logo" width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 19c0-2 1-3 3-3h6c2 0 3 1 3 3" stroke="#5B9BD5" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M7 8v6c0 1.657 1.343 3 3 3h2a3 3 0 003-3V7l2 1" stroke="#5B9BD5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9.5" cy="6.5" r=".75" fill="#5B9BD5"/>
      </svg>
      <div class="logo-text">FacturaLlama</div>
    </div>

    <h1 class="title">Iniciar Sesión</h1>

    <form class="form" (submit)="$event.preventDefault()">
      <label class="label">Correo Electrónico</label>
      <div class="input-group">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <input class="input" type="email" />
      </div>

      <label class="label mt-md">Contraseña</label>
      <div class="input-group">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="6" y="10" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M9 10V7a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </span>
        <input class="input" type="password" />
        <span class="input-trailing">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </span>
      </div>

      <div class="links-col">
        <a href="#" class="link">¿Olvidaste tu contraseña?</a>
        <div class="signup-row">¿No tienes una cuenta? <a href="#" class="link-strong">Regístrate</a></div>
      </div>

      <button type="submit" class="btn btn-primary submit" (click)="entrar()">Entrar</button>
    </form>
  </div>
</div>
