<div class="login-page">
  <div class="login-card">
    <div class="logo-row">
      <svg class="llama-logo" width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 19c0-2 1-3 3-3h6c2 0 3 1 3 3" stroke="#5B9BD5" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M7 8v6c0 1.657 1.343 3 3 3h2a3 3 0 003-3V7l2 1" stroke="#5B9BD5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9.5" cy="6.5" r=".75" fill="#5B9BD5"/>
      </svg>
      <div class="logo-text">WaveDTE-v2</div>
    </div>

    <h1 class="title">Iniciar Sesión</h1>

    <form class="form" [formGroup]="loginForm" (ngSubmit)="entrar()">
      <!-- Mensaje de error general -->
      <div class="error-message" *ngIf="errorMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Campo Email -->
      <label class="label" [class.error]="hasFieldError('email')">Correo Electrónico</label>
      <div class="input-group" [class.error]="hasFieldError('email')">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <input 
          class="input" 
          type="email" 
          formControlName="email"
          [class.error]="hasFieldError('email')"
          placeholder="correo@ejemplo.com"
          [disabled]="loading"
        />
      </div>
      <div class="field-error" *ngIf="hasFieldError('email')">
        {{ getFieldError('email') }}
      </div>

      <!-- Campo Contraseña -->
      <label class="label mt-md" [class.error]="hasFieldError('password')">Contraseña</label>
      <div class="input-group" [class.error]="hasFieldError('password')">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="6" y="10" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M9 10V7a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </span>
        <input 
          class="input" 
          [type]="mostrarPassword ? 'text' : 'password'" 
          formControlName="password"
          [class.error]="hasFieldError('password')"
          placeholder="••••••••"
          [disabled]="loading"
        />
        <span class="input-trailing" (click)="toggleMostrarPassword()" style="cursor: pointer;">
          <svg *ngIf="!mostrarPassword" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <svg *ngIf="mostrarPassword" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>
      <div class="field-error" *ngIf="hasFieldError('password')">
        {{ getFieldError('password') }}
      </div>

      <div class="links-col">
        <a href="#" class="link" (click)="$event.preventDefault(); irAForgetPassword()">¿Olvidaste tu contraseña?</a>
        <div class="signup-row">¿No tienes una cuenta? <a href="#" class="link-strong" (click)="$event.preventDefault(); irASignUp()">Regístrate</a></div>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary submit" 
        [disabled]="loading || loginForm.invalid"
        [class.loading]="loading"
      >
        <span *ngIf="!loading">Entrar</span>
        <span *ngIf="loading" class="loading-content">
          <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" stroke-opacity="0.25"/>
            <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          </svg>
          Iniciando sesión...
        </span>
      </button>
    </form>
  </div>
</div>
