<div class="login-page">
  <div class="login-card">
    <div class="logo-row">
      <div class="logo-mark">🐑</div>
      <div class="logo-text">FacturaLlama</div>
    </div>

    <h1 class="title">Iniciar Sesión</h1>

    <form class="form" (submit)="$event.preventDefault()">
      <label class="label">Correo Electrónico</label>
      <input class="input" type="email" placeholder="" />

      <label class="label mt-md">Contraseña</label>
      <div class="password-row">
        <input class="input" type="password" placeholder="" />
      </div>

      <div class="links-row">
        <a href="#" class="link">¿Olvidaste tu contraseña?</a>
        <a href="#" class="link">Regístrate</a>
      </div>

      <button type="submit" class="btn btn-primary submit" (click)="entrar()">Entrar</button>
    </form>
  </div>
</div>
