<div class="modal-overlay" (click)="cerrarModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <h2>Crear Sucursal</h2>
      <button class="btn-cerrar" type="button" (click)="cerrarModal()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <form [formGroup]="form">
        <!-- Datos Generales -->
        <div class="form-section">
          <div class="form-group">
            <label class="form-label">Nombre</label>
            <input 
              type="text" 
              class="form-input" 
              formControlName="nombre"
              placeholder="Nombre"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Tipo de Sucursal</label>
            <select class="form-select" formControlName="tipoSucursal">
              <option value="">Selecciona el tipo de sucursal</option>
              <option *ngFor="let tipo of tiposSucursal" [value]="tipo">{{ tipo }}</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Dirección</label>
            <div class="input-with-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M10 11C11.6569 11 13 9.65685 13 8C13 6.34315 11.6569 5 10 5C8.34315 5 7 6.34315 7 8C7 9.65685 8.34315 11 10 11Z" stroke="currentColor" stroke-width="1.5"/>
                <path d="M17 8C17 13 10 19 10 19C10 19 3 13 3 8C3 4.13401 6.13401 1 10 1C13.866 1 17 4.13401 17 8Z" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <input 
                type="text" 
                class="form-input" 
                formControlName="direccion"
                placeholder="Dirección"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Complemento <span class="optional">(opcional)</span></label>
            <input 
              type="text" 
              class="form-input" 
              formControlName="complemento"
              placeholder="Complemento"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Correo Electrónico</label>
            <div class="input-with-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M3.33333 4H16.6667C17.403 4 18 4.59695 18 5.33333V14.6667C18 15.403 17.403 16 16.6667 16H3.33333C2.59695 16 2 15.403 2 14.6667V5.33333C2 4.59695 2.59695 4 3.33333 4Z" stroke="currentColor" stroke-width="1.5"/>
                <path d="M2 6.66667L10 11.3333L18 6.66667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input 
                type="email" 
                class="form-input" 
                formControlName="correoElectronico"
                placeholder="Correo Electrónico"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Teléfono</label>
            <div class="input-with-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M15 3H5C3.89543 3 3 3.89543 3 5V15C3 16.1046 3.89543 17 5 17H15C16.1046 17 17 16.1046 17 15V5C17 3.89543 16.1046 3 15 3Z" stroke="currentColor" stroke-width="1.5"/>
                <path d="M12 7L8 11L6 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input 
                type="tel" 
                class="form-input" 
                formControlName="telefono"
                placeholder="Teléfono"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Departamento</label>
            <select class="form-select" formControlName="departamento">
              <option value="">Selecciona un departamento</option>
              <option *ngFor="let depto of departamentos" [value]="depto">{{ depto }}</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Municipio</label>
            <select class="form-select" formControlName="municipio" [disabled]="!departamentoSeleccionado">
              <option value="">Selecciona un municipio</option>
              <option *ngFor="let muni of municipios" [value]="muni">{{ muni }}</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Código del Ministerio de Hacienda</label>
            <input 
              type="text" 
              class="form-input" 
              formControlName="codigoMH"
              placeholder="M001"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Cantidad de Puntos de Venta <span class="optional">(opcional)</span></label>
            <input 
              type="number" 
              class="form-input" 
              formControlName="puntosVenta"
              placeholder="1"
            />
          </div>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn-cancelar" type="button" (click)="cerrarModal()">
        Cancelar
      </button>
      <button class="btn-crear" type="button" (click)="crearSucursal()" [disabled]="!form.valid">
        Crear
      </button>
    </div>
  </div>
</div>
