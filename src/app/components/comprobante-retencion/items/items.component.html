<div class="card">
    <button class="card-header" type="button" (click)="collapsed = !collapsed" [class.active]="!collapsed">
        <span class="icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.5" />
            </svg>
        </span>
        <span class="title">Documentos Sujetos a Retención</span>
        <span class="chevron" [class.open]="!collapsed">▾</span>
    </button>
    <div class="card-body" *ngIf="!collapsed">
        <form [formGroup]="form">
            <label class="label">Tipo DTE Relacionado</label>
            <div class="input-group">
                <button type="button" class="input select" (click)="toggleMenu('tipoDte')">
                    {{ form.value.tipoDteRelacionado }}
                </button>
                <button class="btn btn-icon" type="button" (click)="toggleMenu('tipoDte')">▾</button>
                <div class="dropdown" *ngIf="menus['tipoDte']">
                    <button type="button" class="dropdown-item" *ngFor="let t of tiposDocumento"
                        (click)="selectTipoDte(t)">{{ t }}</button>
                </div>
            </div>

            <label class="label">Tipo Generación</label>
            <div class="input-group">
                <button type="button" class="input select" (click)="toggleMenu('tipoGen')">
                    {{ form.value.tipoGeneracion === 1 ? 'Físico' : 'Electrónico' }}
                </button>
                <button class="btn btn-icon" type="button" (click)="toggleMenu('tipoGen')">▾</button>
                <div class="dropdown" *ngIf="menus['tipoGen']">
                    <button type="button" class="dropdown-item" *ngFor="let g of tiposGeneracion"
                        (click)="selectTipoGen(g.val)">{{ g.label }}</button>
                </div>
            </div>

            <label class="label">Fecha de Emisión</label>
            <input class="input" type="date" formControlName="fechaEmision" />

            <label class="label">Número de Documento</label>
            <input class="input" placeholder="Ej. 12345" formControlName="numeroDocumento" />

            <label class="label">Monto Sujeto a Retención (Sin IVA)</label>
            <div class="input-group">
                <span class="prefix">$</span>
                <input class="input" formControlName="montoSujeto" (input)="numberOnly($event); calcRetencion()"
                    (blur)="formatNumber('montoSujeto', 2)" />
            </div>

            <label class="label">Retención (1%)</label>
            <div class="input-group">
                <span class="prefix">$</span>
                <input class="input" formControlName="ivaRetenido" (input)="numberOnly($event)"
                    (blur)="formatNumber('ivaRetenido', 2)" />
            </div>

            <button class="btn btn-primary mt-md" type="button" (click)="agregarItem()">Agregar Documento</button>
        </form>

        <!-- List is shown in the Right Panel in the Page Component as per User Request -->
        <div class="items-list" *ngIf="false">
            <!-- Hidden here because it's in the side panel now -->
        </div>
    </div>
</div>
