<div class="modal-overlay" (click)="onCerrar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="icon-container" [class.exito]="tipo === 'exito'" [class.error]="tipo === 'error'">
        @if (tipo === 'exito') {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        } @else {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        }
      </div>
      @if (titulo) {
        <h2 class="modal-title">{{ titulo }}</h2>
      }
    </div>
    
    <div class="modal-body">
      <p class="modal-message">{{ mensaje }}</p>
    </div>

    <div class="modal-footer">
      <button class="btn-aceptar" (click)="onCerrar()" type="button">Aceptar</button>
    </div>
  </div>
</div>
