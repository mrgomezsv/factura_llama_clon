<div class="forgot-page">
  <div class="forgot-card">
    <h1 class="title">Recuperar Contraseña</h1>

    <form class="form" (submit)="$event.preventDefault(); enviar()">
      <label class="label">Ingresa tu correo electrónico</label>
      <input class="input" type="email" />

      <button type="submit" class="btn btn-primary submit">Enviar instrucciones</button>

      <div class="login-link">
        ¿Ya tienes una cuenta? <a href="#" class="link" (click)="$event.preventDefault(); entrar()">Entrar</a>
      </div>
    </form>
  </div>
</div>
