<div class="modal-overlay" (click)="cerrarModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Crear Cliente</h2>
      <button class="btn-cerrar" (click)="cerrarModal()" type="button">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="form" class="modal-body">
      <!-- Datos Generales -->
      <div class="form-section">
        <h3 class="section-title">Datos Generales</h3>
        
        <div class="form-group">
          <label class="form-label">Nombre</label>
          <input 
            type="text" 
            class="form-input"
            formControlName="nombre"
            placeholder="Nombre"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Alias</label>
          <input 
            type="text" 
            class="form-input"
            formControlName="alias"
            placeholder="Alias"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Nombre Comercial</label>
          <input 
            type="text" 
            class="form-input"
            formControlName="nombreComercial"
            placeholder="Nombre Comercial"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Correo Electrónico</label>
          <div class="input-with-icon">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M3 7H17L15 15H5L3 7Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input 
              type="email" 
              class="form-input"
              formControlName="correoElectronico"
              placeholder="correo"
            />
          </div>
          <span class="form-hint">Usa de 1 a 40 caracteres. Puedes usar a-z, 0-9, . (punto), - (guion) y _ (guion bajo).</span>
        </div>

        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <div class="input-with-icon">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M3.33333 2.66667C2.59695 2.66667 2 3.26362 2 4V12C2 12.7364 2.59695 13.3333 3.33333 13.3333H12.6667C13.403 13.3333 14 12.7364 14 12V4C14 3.26362 13.403 2.66667 12.6667 2.66667H3.33333Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M2 5.33333L8 9.33333L14 5.33333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input 
              type="tel" 
              class="form-input"
              formControlName="telefono"
              placeholder="Teléfono"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Tipo de Persona</label>
          <select class="form-select" formControlName="tipoPersona">
            <option *ngFor="let tipo of tiposPersona" [value]="tipo">{{ tipo }}</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Clasificación Tributaria</label>
          <select class="form-select" formControlName="clasificacionTributaria">
            <option *ngFor="let clasif of clasificacionesTributarias" [value]="clasif">{{ clasif }}</option>
          </select>
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="esSujetoExcluido" />
            <span>¿Es Sujeto Excluido?</span>
          </label>
        </div>
      </div>

      <!-- Datos Fiscales -->
      <div class="form-section">
        <h3 class="section-title">Datos Fiscales</h3>

        <div class="form-group">
          <label class="form-label">Tipo de Documento</label>
          <select class="form-select" formControlName="tipoDocumento">
            <option value="">Selecciona el Tipo de Documento</option>
            <option *ngFor="let tipo of tiposDocumento" [value]="tipo">{{ tipo }}</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Número de Documento</label>
          <input 
            type="text" 
            class="form-input"
            formControlName="numeroDocumento"
            placeholder="Número de Documento"
          />
        </div>

        <div class="form-group">
          <label class="form-label">NRC</label>
          <input 
            type="text" 
            class="form-input"
            formControlName="nrc"
            placeholder="NRC"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Actividad Económica</label>
          <div class="dropdown-actividad-container">
            <input 
              type="text" 
              class="form-input"
              formControlName="actividadEconomica"
              placeholder="Selecciona una actividad económica"
              (focus)="mostrarActividadesDropdown = true"
              (input)="filtrarActividadesEconomicas($any($event.target).value)"
              [value]="form.get('actividadEconomica')?.value"
            />
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" class="dropdown-arrow">
              <path d="M4 6L10 12L16 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            @if (mostrarActividadesDropdown) {
              <div class="dropdown-actividades">
                @for (actividad of actividadesEconomicasFiltradas; track actividad) {
                  <button 
                    type="button"
                    class="dropdown-actividad-item"
                    (click)="seleccionarActividadEconomica(actividad)"
                  >
                    {{ actividad }}
                  </button>
                }
              </div>
            }
          </div>
        </div>
      </div>

      <!-- Dirección -->
      <div class="form-section">
        <h3 class="section-title">Dirección</h3>

        <div class="form-group">
          <label class="form-label">País</label>
          <select class="form-select" formControlName="pais">
            <option *ngFor="let pais of paises" [value]="pais">{{ pais }}</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Departamento</label>
          <select class="form-select" formControlName="departamento">
            <option value="">Selecciona un departamento</option>
            <option *ngFor="let depto of departamentos" [value]="depto">{{ depto }}</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Municipio</label>
          <select class="form-select" formControlName="municipio">
            <option value="">Selecciona un municipio</option>
            <option *ngFor="let muni of municipios" [value]="muni">{{ muni }}</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Dirección</label>
          <div class="input-with-icon">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M3 7H17L15 15H5L3 7Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input 
              type="text" 
              class="form-input"
              formControlName="direccion"
              placeholder="Dirección"
            />
          </div>
        </div>
      </div>
    </form>

    <div class="modal-footer">
      <button class="btn-cancelar" (click)="cerrarModal()" type="button">Cancelar</button>
      <button class="btn-crear" (click)="crearCliente()" type="button" [disabled]="!form.valid">Crear</button>
    </div>
  </div>
</div>
