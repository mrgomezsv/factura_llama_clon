<div class="upgrade-backdrop" (click)="onClose()"></div>

<div class="upgrade-modal" role="dialog" aria-modal="true">
  <button type="button" class="close-btn" aria-label="Cerrar" (click)="onClose()">×</button>

  <div class="modal-content">
    <div class="left">
      <div class="logo">🐑</div>
      <h2 class="title">Actualiza al plan Profesional</h2>
      <ul class="features">
        <li>5 usuarios</li>
        <li>300 DTEs mensuales</li>
        <li>Confirmación de entrega de tus DTEs a tus clientes</li>
        <li>Recepción de los DTEs relacionados con tus compras</li>
        <li>Anexos</li>
        <li>Libros de IVA</li>
        <li>Personalización de PDF</li>
        <li>Gestión de usuarios</li>
      </ul>
    </div>
    <div class="right">
      <div class="summary">
        <div class="summary-title">Resumen</div>
        <div class="summary-item">✅ Activación inmediata</div>
      </div>
      <button class="btn-primary action" type="button" (click)="onClose()">Cambiar de plan</button>
    </div>
  </div>
</div>
