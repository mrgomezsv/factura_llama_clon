<div class="tabs-container">
  <div class="tabs">
    <button
      class="tab"
      [class.active]="tabActiva === 'enviados'"
      (click)="cambiarTab('enviados')"
      type="button"
    >
      <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Enviados
    </button>

    <button
      class="tab"
      [class.active]="tabActiva === 'recibidos'"
      (click)="cambiarTab('recibidos')"
      type="button"
    >
      <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="6" width="18" height="14" rx="1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 8L12 15L21 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 15V20M9 18L12 20L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Recibidos
    </button>
  </div>
</div>
